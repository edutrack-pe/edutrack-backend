name: Deploy a AWS EC2

# Despliegue manual: Actions > Deploy a AWS EC2 > Run workflow.
# Secrets requeridos en la organizacion o el repo: EC2_HOST, EC2_USER, EC2_SSH_KEY
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: bash ~/edutrack/edutrack-backend/infra/scripts/deploy.sh
