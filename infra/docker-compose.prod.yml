# PRODUCCION en AWS EC2. La base de datos es AWS RDS MySQL (DATABASE_URL en .env).
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
name: edutrack-prod

services:
  ml-service:
    build: ../../edutrack-ml/ml-service
    restart: unless-stopped
    expose: ["8001"]          # solo red interna de Docker

  backend:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      ML_SERVICE_URL: http://ml-service:8001
    expose: ["8000"]
    depends_on: [ml-service]

  nginx:
    build:
      context: ../../edutrack-frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [backend]
