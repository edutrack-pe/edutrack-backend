# Entorno de DESARROLLO. Clona los 3 repos en la misma carpeta y ejecuta desde edutrack-backend/:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
name: edutrack

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: edutrack
      MYSQL_USER: edutrack
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  ml-service:
    build: ../../edutrack-ml/ml-service
    ports: ["8001:8001"]

  backend:
    build: ..
    env_file: ../.env
    environment:
      DATABASE_URL: mysql+pymysql://edutrack:${MYSQL_PASSWORD}@mysql:3306/edutrack
      ML_SERVICE_URL: http://ml-service:8001
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: [../app:/app/app, ../scripts:/app/scripts]
    depends_on:
      mysql: { condition: service_healthy }
      ml-service: { condition: service_started }

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    volumes:
      - ../../edutrack-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

volumes:
  mysql_data:
  frontend_node_modules:
